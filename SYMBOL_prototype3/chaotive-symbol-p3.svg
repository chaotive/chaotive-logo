      C 565 190 570 228 600 228
      C 630 228 635 190 675 190
      H 900
      L 1040 330
      V 870
      L 900 1010
      H 675
      C 635 1010 630 972 600 972
      C 570 972 565 1010 525 1010
      H 300
      L 160 870
      V 330
