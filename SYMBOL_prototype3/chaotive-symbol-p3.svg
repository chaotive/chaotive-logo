      C 635 335 640 295 685 295
      H 865
      L 935 365
      V 835
      L 865 905
      H 685
      C 640 905 635 865 600 865
      C 565 865 560 905 515 905
      H 335
      L 265 835
      V 365
      Z"/>

    <clipPath id="leftHalf">
