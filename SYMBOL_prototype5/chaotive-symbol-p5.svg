<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Chaotive Creative Chaos symbol prototype 5</title>
  <desc id="desc">A fine wide connected opposing C frame gives visual priority to the approved central spark and continuous three-planet orbit.</desc>
  <defs>
    <path id="connectedCs" fill-rule="evenodd" d="
      M 200 80
      H 540
      L 575 115
      H 600
      L 635 80
      H 1000
      L 1120 200
      V 600
      L 1000 720
      H 660
      L 625 685
      H 600
      L 565 720
      H 200
      L 80 600
      V 200
      Z

      M 228 122
      H 520
      L 555 157
      H 600
      L 645 122
      H 972
      L 1078 228
      V 572
      L 972 678
      H 680
      L 645 643
      H 600
      L 555 678
      H 228
      L 122 572
      V 228
      Z"/>

    <clipPath id="leftHalf">
      <path d="M 0 0 H 600 L 575 105 L 625 145 L 600 200 V 600 L 625 655 L 575 695 L 600 800 H 0 Z"/>
    </clipPath>
    <clipPath id="rightHalf">
      <path d="M 1200 0 H 600 L 575 105 L 625 145 L 600 200 V 600 L 625 655 L 575 695 L 600 800 H 1200 Z"/>
