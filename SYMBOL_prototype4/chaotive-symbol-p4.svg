    <circle cx="734" cy="478" r="22"/>
    <circle cx="466" cy="478" r="20"/>
  </g>

  <path fill="#013787" aria-label="Approved central creativity spark" d="
    M 600 300
    C 616 353 647 384 700 400
    C 647 416 616 447 600 500
    C 584 447 553 416 500 400
    C 553 384 584 353 600 300
    Z"/>
</svg>
