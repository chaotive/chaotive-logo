    <use href="#connectedCs" fill="#013787" clip-path="url(#rightHalf)"/>
  </g>

  <circle cx="600" cy="400" r="155" fill="none" stroke="#FB011C" stroke-width="20" aria-label="Continuous circular orbit"/>

  <g fill="#FB011C" aria-label="Three planets seated on the orbit">
