<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Chaotive Creative Chaos symbol prototype 4</title>
  <desc id="desc">A wide connected opposing C enclosure in the exact wordmark palette surrounds the approved central spark and continuous three-planet orbit.</desc>
  <defs>
    <path id="connectedCs" fill-rule="evenodd" d="
      M 200 80
      H 525
      C 565 80 570 115 600 115
      C 630 115 635 80 675 80
      H 1000
      L 1120 200
      V 600
      L 1000 720
      H 675
      C 635 720 630 685 600 685
      C 570 685 565 720 525 720
      H 200
      L 80 600
      V 200
      Z

      M 250 165
      H 515
      C 560 165 565 200 600 200
      C 635 200 640 165 685 165
      H 950
      L 1035 250
      V 550
      L 950 635
      H 685
      C 640 635 635 600 600 600
      C 565 600 560 635 515 635
      H 250
      L 165 550
      V 250
      Z"/>

    <clipPath id="leftHalf">
      <path d="M 0 0 H 600 C 555 90 645 145 600 220 C 555 295 645 350 600 400 C 555 450 645 505 600 580 C 555 655 645 710 600 800 H 0 Z"/>
    </clipPath>
    <clipPath id="rightHalf">
      <path d="M 1200 0 H 600 C 555 90 645 145 600 220 C 555 295 645 350 600 400 C 555 450 645 505 600 580 C 555 655 645 710 600 800 H 1200 Z"/>
    </clipPath>
