<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Chaotive Creative Chaos symbol prototype 8</title>
  <defs><linearGradient id="sparkColors" x1="0" y1="1" x2="1" y2="0"><stop offset="50%" stop-color="#013787"/><stop offset="50%" stop-color="#FB011C"/></linearGradient></defs>
  <desc id="desc">Independent angular left and right C bodies connect only through opposite sides of the central orbit surrounding a dominant creativity spark.</desc>

<path d="M 560 101 H 214 L 101 214 V 586 L 214 699 H 560" fill="none" stroke="#FB011C" stroke-width="18" stroke-linejoin="miter"/>

<path d="M 640 101 H 986 L 1099 214 V 586 L 986 699 H 640" fill="none" stroke="#013787" stroke-width="18" stroke-linejoin="miter"/>

  <g fill="none" stroke="#FB011C" stroke-linecap="round" aria-label="Enlarged orbit with tapered connection approaches">
    <path d="M 695 241 A 185 185 0 0 1 570 582.6" stroke-width="42"/>
    <path d="M 507 560 A 185 185 0 0 1 630 217.4" stroke-width="42"/>
  </g>

  <path fill="#FB011C" aria-label="Only connection from left C to upper-right orbit" d="M 562.7 117.9 L 577.3 104.1 L 698.6 232.6 L 691.4 239.4 Z"/>
  <path fill="#013787" aria-label="Only connection from right C to lower-left orbit" d="M 637.5 693.4 L 622.5 706.6 L 503.7 563.3 L 511.3 556.7 Z"/>

  <g fill="#FB011C" aria-label="Three planets seated on the enlarged orbit">
    <circle cx="600" cy="215" r="26"/>
    <circle cx="760" cy="493" r="23"/>
    <circle cx="440" cy="493" r="21"/>
  </g>

  <path fill="url(#sparkColors)" aria-label="Dominant central creativity spark" d="
    M 600 275
    C 620 341 659 380 725 400
    C 659 420 620 459 600 525
    C 580 459 541 420 475 400
    C 541 380 580 341 600 275
    Z"/>
</svg>
