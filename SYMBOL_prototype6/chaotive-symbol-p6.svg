    <path d="M 476.2 537.5 A 185 185 0 0 1 657.2 224.1" stroke-width="18"/>
    <path d="M 657.2 224.1 A 185 185 0 0 1 723.8 262.5" stroke-width="10"/>
    <path d="M 542.8 575.9 A 185 185 0 0 1 476.2 537.5" stroke-width="10"/>
  </g>

  <path fill="#FB011C" aria-label="Left C to upper-right orbit connector" d="M 554.7 165.5 L 565.3 148.5 L 695.2 235.6 L 689.8 244 Z"/>
  <path fill="#013787" aria-label="Right C to lower-left orbit connector" d="M 655 634.3 L 645 651.7 L 504.5 564.3 L 509.5 555.7 Z"/>

  <g fill="#FB011C" aria-label="Three planets seated on the enlarged orbit">
